<!DOCTYPE html>
<html>

<head>
    <title>Simple RAG Chatbot</title>

    <style>

        body{
            font-family: Arial;
            width: 800px;
            margin:auto;
            padding-top:40px;
        }

        #chat-box{
            border:1px solid #ccc;
            height:400px;
            overflow-y:auto;
            padding:10px;
            margin-bottom:10px;
        }

        .user{
            color:blue;
            margin-bottom:10px;
        }

        .bot{
            color:green;
            margin-bottom:20px;
        }

    </style>
</head>

<body>

    <h2>PDF RAG Chatbot</h2>

    <h3>Upload PDF</h3>

    <input
        type="file"
        id="pdfFile">

    <button onclick="uploadPDF()">
        Upload
    </button>

    <p id="uploadStatus"></p>

    <hr>

    <div id="chat-box"></div>

    <input
        type="text"
        id="question"
        placeholder="Ask a question..."
        style="width:600px;">

    <button onclick="sendQuestion()">
        Send
    </button>

    <script>

        async function uploadPDF(){

            const fileInput =
                document.getElementById(
                    "pdfFile"
                );

            const file =
                fileInput.files[0];

            let formData =
                new FormData();

            formData.append(
                "file",
                file
            );

            const response =
                await fetch(
                    "/upload",
                    {
                        method:"POST",
                        body:formData
                    }
                );

            const data =
                await response.json();

            document.getElementById(
                "uploadStatus"
            ).innerText =
                data.message;
        }


        async function sendQuestion(){

            const question =
                document.getElementById(
                    "question"
                ).value;

            let formData =
                new FormData();

            formData.append(
                "question",
                question
            );

            const response =
                await fetch(
                    "/chat",
                    {
                        method:"POST",
                        body:formData
                    }
                );

            const data =
                await response.json();

            const chatBox =
                document.getElementById(
                    "chat-box"
                );

            chatBox.innerHTML +=
                `<div class="user">
                    <b>You:</b> ${question}
                </div>`;

            chatBox.innerHTML +=
                `<div class="bot">
                    <b>Bot:</b> ${data.answer}
                </div>`;

            document.getElementById(
                "question"
            ).value = "";
        }

    </script>

</body>
</html>
