<!DOCTYPE html>



<html lang="en">



<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF RAG Chatbot</title>



```

<style>

    *{

        margin:0;

        padding:0;

        box-sizing:border-box;

    }



    body{

        font-family:Arial,sans-serif;

        background:#f5f5f5;

        display:flex;

        justify-content:center;

        align-items:center;

        height:100vh;

    }



    .container{

        width:90%;

        max-width:900px;

        height:90vh;

        background:white;

        border-radius:12px;

        box-shadow:0 0 20px rgba(0,0,0,0.1);

        display:flex;

        flex-direction:column;

        overflow:hidden;

    }



    .header{

        background:#4f46e5;

        color:white;

        padding:20px;

        text-align:center;

    }



    .upload-section{

        padding:15px;

        border-bottom:1px solid #ddd;

        display:flex;

        gap:10px;

        align-items:center;

    }



    .upload-btn,

    .send-btn{

        padding:10px 20px;

        border:none;

        border-radius:6px;

        background:#4f46e5;

        color:white;

        cursor:pointer;

    }



    .upload-btn:disabled,

    .send-btn:disabled{

        opacity:0.5;

        cursor:not-allowed;

    }



    #uploadStatus{

        font-size:14px;

        color:green;

    }



    #chat-box{

        flex:1;

        overflow-y:auto;

        padding:20px;

        background:#fafafa;

    }



    .message{

        margin-bottom:15px;

        display:flex;

    }



    .user{

        justify-content:flex-end;

    }



    .bot{

        justify-content:flex-start;

    }



    .bubble{

        max-width:75%;

        padding:12px;

        border-radius:10px;

        white-space:pre-wrap;

        line-height:1.5;

    }



    .user .bubble{

        background:#4f46e5;

        color:white;

    }



    .bot .bubble{

        background:#e5e7eb;

        color:black;

    }



    .input-section{

        display:flex;

        gap:10px;

        padding:15px;

        border-top:1px solid #ddd;

    }



    #question{

        flex:1;

        padding:12px;

        border:1px solid #ccc;

        border-radius:6px;

    }



    .typing{

        color:#666;

        font-style:italic;

        margin-bottom:10px;

    }



</style>

```



</head>



<body>



<div class="container">



```

<div class="header">

    <h2>PDF RAG Chatbot</h2>

    <p>Upload a PDF and ask questions</p>

</div>



<div class="upload-section">



    <input

        type="file"

        id="pdfFile"

        accept=".pdf"

    >



    <button

        class="upload-btn"

        id="uploadBtn"

        onclick="uploadPDF()"

    >

        Upload PDF

    </button>



    <span id="uploadStatus"></span>



</div>



<div id="chat-box"></div>



<div class="input-section">



    <input

        type="text"

        id="question"

        placeholder="Ask a question..."

    >



    <button

        class="send-btn"

        id="sendBtn"

        onclick="sendQuestion()"

    >

        Send

    </button>



</div>

```



</div>



<script>



const API_BASE = "";



let pdfUploaded = false;



const chatBox = document.getElementById("chat-box");



function addMessage(type,text){



    const wrapper =

        document.createElement("div");



    wrapper.className =

        `message ${type}`;



    const bubble =

        document.createElement("div");



    bubble.className =

        "bubble";



    bubble.textContent =

        text;



    wrapper.appendChild(

        bubble

    );



    chatBox.appendChild(

        wrapper

    );



    chatBox.scrollTop =

        chatBox.scrollHeight;

}





function showTyping(){



    const div =

        document.createElement("div");



    div.id =

        "typing";



    div.className =

        "typing";



    div.textContent =

        "AI is thinking...";



    chatBox.appendChild(div);



    chatBox.scrollTop =

        chatBox.scrollHeight;

}





function removeTyping(){



    const element =

        document.getElementById(

            "typing"

        );



    if(element){

        element.remove();

    }

}





async function uploadPDF(){



    const fileInput =

        document.getElementById(

            "pdfFile"

        );



    const file =

        fileInput.files[0];



    if(!file){



        alert(

            "Please select a PDF"

        );



        return;

    }



    const uploadBtn =

        document.getElementById(

            "uploadBtn"

        );



    const uploadStatus =

        document.getElementById(

            "uploadStatus"

        );



    uploadBtn.disabled = true;



    uploadStatus.textContent =

        "Processing PDF...";



    const formData =

        new FormData();



    formData.append(

        "file",

        file

    );



    try{



        const response =

            await fetch(

                `${API_BASE}/upload`,

                {

                    method:"POST",

                    body:formData

                }

            );



        const data =

            await response.json();



        if(!response.ok){



            throw new Error(

                data.detail ||

                "Upload failed"

            );

        }



        pdfUploaded = true;



        uploadStatus.textContent =

            "PDF Uploaded Successfully";



    }

    catch(error){



        uploadStatus.textContent =

            error.message;



    }

    finally{



        uploadBtn.disabled = false;



    }

}





async function sendQuestion(){



    const questionInput =

        document.getElementById(

            "question"

        );



    const question =

        questionInput.value.trim();



    if(!question){

        return;

    }



    if(!pdfUploaded){



        addMessage(

            "bot",

            "Please upload a PDF first."

        );



        return;

    }



    addMessage(

        "user",

        question

    );



    questionInput.value = "";



    const sendBtn =

        document.getElementById(

            "sendBtn"

        );



    sendBtn.disabled = true;



    showTyping();



    const formData =

        new FormData();



    formData.append(

        "question",

        question

    );



    try{



        const response =

            await fetch(

                `${API_BASE}/chat`,

                {

                    method:"POST",

                    body:formData

                }

            );



        const data =

            await response.json();



        removeTyping();



        if(!response.ok){



            throw new Error(

                data.detail ||

                "Chat failed"

            );

        }



        addMessage(

            "bot",

            data.answer

        );



    }

    catch(error){



        removeTyping();



        addMessage(

            "bot",

            error.message

        );

    }

    finally{



        sendBtn.disabled = false;



    }

}





document

.getElementById("question")

.addEventListener(

    "keydown",

    function(event){



        if(event.key === "Enter"){



            event.preventDefault();



            sendQuestion();

        }

    }

);



</script>



</body>

</html>
